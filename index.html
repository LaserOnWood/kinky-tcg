<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <title>Pass-Card • Chasse aux Trésors</title>
  
  <!-- Polices originales si nécessaires (vérifiées dans style.css) -->
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,600;1,600&family=Poppins:wght@400;600&display=swap" rel="stylesheet">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
 
  <!--Icone ico-->
  <link rel="icon" type="image/x-icon" href="../tcgproto/assets/ico/trading-card.png" />

  <!-- Style Original -->
  <link rel="stylesheet" href="css/style.css">
  
  <style>
    /* Styles spécifiques pour l'écran de sélection (sans Bootstrap pour éviter les conflits) */
    #selection-screen {
      position: fixed;
      top: 0; left: 0;
      width: 100%; height: 100%;
      background: var(--bg-void);
      z-index: 2000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      overflow-y: auto;
      text-align: center;
    }
    #selection-screen h1 {
      margin-bottom: 30px;
      background: linear-gradient(100deg, var(--ink) 30%, var(--gold-soft) 55%, var(--ink) 75%);
      -webkit-background-clip: text; background-clip: text; color: transparent;
      font-family: var(--ff-display);
    }
    .themes-list {
      width: 100%;
      max-width: 500px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }
    .theme-card {
      background: var(--bg-panel);
      border: 1px solid var(--line);
      border-radius: var(--r-md);
      padding: 20px;
      cursor: pointer;
      transition: transform 0.3s cubic-bezier(.22,1,.36,1), border-color 0.3s;
      position: relative;
      text-align: left;
    }
    .theme-card:hover {
      transform: translateY(-5px);
      border-color: var(--gold);
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }
    .theme-card h3 {
      margin: 0 0 8px;
      color: var(--gold-soft);
      font-family: var(--ff-display);
      font-size: 24px;
    }
    .theme-card p {
      margin: 0 0 12px;
      color: var(--ink-muted);
      font-size: 14px;
      line-height: 1.4;
    }
    .theme-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .diff-badge {
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      padding: 4px 10px;
      border-radius: 99px;
      background: var(--bg-panel-2);
      border: 1px solid var(--line);
      color: var(--gold);
    }
    .card-count {
      font-size: 11px;
      color: var(--ink-muted);
      opacity: 0.7;
    }
    .hidden { display: none !important; }

    /* Bouton retour personnalisé pour s'intégrer au header original */
    #back-to-selection {
      background: transparent;
      border: 1px solid var(--line);
      color: var(--ink-muted);
      border-radius: 99px;
      padding: 4px 12px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }
    #back-to-selection:hover {
      border-color: var(--gold);
      color: var(--gold-soft);
    }
    .header-controls {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

<!-- Écran de sélection -->
<div id="selection-screen">
  <h1>Choisissez votre Thème</h1>
  <div id="themes-container" class="themes-list">
    <div style="color: var(--ink-muted)">Chargement des thèmes...</div>
  </div>
</div>

<!-- Contenu du jeu -->
<div id="game-content" class="hidden">
  <header class="top">
    <div class="header-controls">
      <button id="back-to-selection">
        <i class="fas fa-chevron-left"></i> Retour
      </button>
      <p class="eyebrow">Chasse aux trésors</p>
      <div style="width: 60px;"></div>
    </div>
    <h1 id="game-title">Pass-Card</h1>
    <div class="progress-wrap">
      <div class="progress-track"><div class="progress-fill" id="progress-fill"></div></div>
      <div class="progress-label" id="progress-label">0 / 0</div>
    </div>
  </header>
  
  <main>
    <div class="grid" id="grid"></div>
  </main>
  
  <div class="entry-bar">
    <p class="feedback" id="feedback">&nbsp;</p>
    <div class="entry-inner" id="entry-inner">
      <input id="pwd-input" type="text" placeholder="Entrer le mot de passe…" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="submit-btn">Valider</button>
    </div>
  </div>
  
  <div class="overlay" id="overlay">
    <div class="box">
      <h2>Collection complète</h2>
      <p>Bien jouer. Toutes les cartes ont été révélées. <br>Maintenant il faut mettre en applications chaque carte.</p>
      <button id="overlay-close">Fermer</button>
    </div>
  </div>
</div>

    <script src="js/notification.js"></script>
    <script src="js/passemot.js"></script>
    <script src="js/hasheur.js"></script>
</body>
</html>
