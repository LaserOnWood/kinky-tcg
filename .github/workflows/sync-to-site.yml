name: Synchroniser avec le site principal

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    name: Publier Kinky TCG dans LaserOnWood.github.io
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer Kinky TCG
        uses: actions/checkout@v4

      - name: Générer l’inventaire d’images
        run: node scripts/generate-gallery.mjs

      - name: Enregistrer l’inventaire généré dans le dépôt
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- json/gallery.json; then
            echo "L’inventaire est déjà à jour."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add json/gallery.json
          git commit -m "Actualiser l’inventaire des images"
          git push origin HEAD:main

      - name: Récupérer le dépôt du site principal
        uses: actions/checkout@v4
        with:
          repository: LaserOnWood/LaserOnWood.github.io
          token: ${{ secrets.SITE_REPO_TOKEN }}
          path: site
          fetch-depth: 0

      - name: Remplacer le dossier game/tcgproto
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site/game/tcgproto
          mkdir -p site/game/tcgproto
          cp -a ./assets site/game/tcgproto/
          cp -a ./css site/game/tcgproto/
          cp -a ./js site/game/tcgproto/
          cp -a ./json site/game/tcgproto/
          cp -a ./index.html site/game/tcgproto/
          cp -a ./gallery.html site/game/tcgproto/

      - name: Publier les changements
        working-directory: site
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add game/tcgproto
          if git diff --cached --quiet; then
            echo "Aucun changement à publier."
            exit 0
          fi
          git commit -m "Synchroniser Kinky TCG depuis le dépôt dédié"
          git push origin HEAD:main
